<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>合成大西瓜 · 人脸版</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 30%, #fff0f5 0%, #ffe4ec 45%, #ffd6e3 100%);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-frame {
            display: block;
            border: 0;
            /* 按 9:16 最大化适配窗口 */
            width: min(100vw, calc(100vh * 9 / 16));
            height: min(100vh, calc(100vw * 16 / 9));
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 18px 60px rgba(180, 60, 110, 0.25);
            background: #ffe4ec;
        }

        /* 窄屏/移动端时去掉圆角，避免遮挡 */
        @media (max-width: 640px) {
            #game-frame {
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <iframe id="game-frame" src="game.html" allow="autoplay" title="合成大西瓜"></iframe>
</body>

</html>
